<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fa3a3a"/>
      <stop offset="1" stop-color="#7a0d0d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Фон: скруглённый квадрат с фирменным градиентом -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Лёгкий блик сверху для объёма -->
